schema: spec-driven

# Contexto y reglas que el CLI entrega a cualquier ejecutor vía
# `openspec instructions <artefacto> --change <id> --json`.
#
# Éste es el canal por el que viaja la metodología. Una regla que sólo exista en
# un archivo suelto no la ve quien no lo abra: eso ya pasó acá, con un runtime
# que nunca tuvo instalados los comandos y trabajó con reglas locales sin saberlo.

context: |
  GitCron es un cliente Git de escritorio en Electron + Next.js + TypeScript, con una vista
  cronométrica (diagonal temporal) y un Temporal Agent de IA opt-in. Español como idioma del
  producto y de la documentación.

  Stack: Next.js 15 export estático + React 19 + Tailwind 4 en el renderer; Electron en el main;
  Zustand para estado; simple-git y Octokit para Git y GitHub; node:sqlite para persistencia;
  tsup + electron-builder para el build; Vitest para tests.

  Las restricciones de producto —seguridad, estética y features que no se tocan— están en
  `docs/01_INVARIANTES.md`. Son condición de aceptación, no sugerencias: si una invariante choca
  con hacer que algo funcione, hay que parar y preguntar, no degradarla. El estado real del
  código está en `docs/00_FUENTE_DE_VERDAD.md`; si contradice al código, manda el código.

  Cierre de una tanda: `pnpm exec tsc --noEmit` en cero y `pnpm test` en verde, más
  `openspec validate <change> --strict`. La suite tiene un flake conocido en los archivos que
  crean repositorios Git reales, así que conviene correrla más de una vez antes de declararla
  verde. Sobre los archivos que se tocan, el lint se corre y se deja limpio.

  Declarar "verificado" sin haber corrido el comando invalida la tanda entera. Reportar el
  resultado real —incluido "no mejoró" o "sigue fallando"— vale más que declarar un verde.

  Git: no ejecutar `git add`, commit, push, merge, tag ni release salvo autorización explícita.
  Cuando se sugiera preparar archivos, enumerarlos uno por uno; nunca un directorio completo.
  No agregar dependencias sin aprobación explícita.

  Rama por cambio: todo cambio se trabaja en `change/<slug>`, con el mismo slug del cambio. Al abrirlo,
  antes de escribir ningún artefacto, crear la rama y pararse en ella con
  `git checkout -b change/<slug>`. Si la rama ya existe, informarlo y no reutilizarla: cambiarse a una
  rama con trabajo de otro cambio arrastra sus commits, y eso lo decide una persona, no el ejecutor.
  Esto vale igual si el cambio se creó desde la terminal con `openspec new change`, que es el caso
  habitual; la convención no depende de haber pasado por ninguna pantalla. El prefijo `change/`
  distingue estas ramas de `imagined/*` y `flight/*`, que ya significan otra cosa acá. Crear la rama es
  parte de abrir el cambio y no algo que haya que pedir: es local, reversible y no publica nada. Lo que
  sí se informa es que se creó y con qué nombre.

  Método: la base es OpenSpec. Sus instrucciones son el método y este proyecto no las duplica. Ninguna
  regla se escribe sin aprobación explícita —se puede proponer, no escribir—, y una regla propia existe
  sólo si cubre algo que OpenSpec no cubre. El principio completo, con su límite, está en `AGENTS.md`.

  Runtime: la aplicación corre sobre Electron y empaqueta su propio Chromium, así que una función del
  navegador ya disponible de forma amplia se usa sin código de respaldo. La declaración completa, con la
  versión y con lo que no habilita, está en `AGENTS.md`; vive ahí porque las herramientas que responden
  consultas sobre prácticas web buscan la política de soporte en ese archivo.

  Fallow y CodeGraph son rutinas que se corren cuando se piden, no automatismos de cierre.

  Ante ambigüedad de alcance: preguntar, no asumir. Frenar y reportar cuesta una vuelta;
  adivinar cuesta una tanda.

# Sólo lo que OpenSpec no dice ya.
#
# El CLI entrega, además de estas reglas, la `instruction` de cada artefacto, y
# ahí ya están el formato de las tareas —secciones `## N.` y casillas `N.M`—, las
# cuatro almohadillas de un escenario, el bloque entero que exige MODIFIED, las
# alternativas de cada decisión y los riesgos con su mitigación. Repetirlas acá
# gastaba atención en algo que el ejecutor recibe dos párrafos antes, y hacía más
# difícil ver las que sí son de este proyecto.
#
# Se auditó regla por regla contra `openspec instructions` y se retiraron ocho.
rules:
  proposal:
    - "Escribir en español, en prosa densa y sin relleno. Nada de listas de viñetas donde alcanza una frase."
    - "Declarar explícitamente qué queda fuera de alcance, no sólo qué entra."
    - "Si el cambio corrige un defecto, citar la evidencia concreta que lo prueba: salida de un comando, una medición, o archivo y línea."
    - "No prometer una mejora que no se midió. Si el beneficio es una hipótesis, decir que lo es."

  specs:
    - "Cada requisito lleva su palabra normativa dentro de los primeros 100 caracteres del texto. El parser trunca ahí y rechaza el requisito si no la encuentra."
    - "Todo requisito necesita al menos un escenario, y un change sin ningún delta de spec no valida."
    - "Explicar el fundamento del requisito, no sólo la regla: qué se rompe si no se cumple."

  design:
    - "Si algo no se midió, declararlo. No presentar una expectativa como si fuera un resultado."

  tasks:
    - "No crear tareas que ningún actor pueda marcar. Si una tarea depende de una validación humana, tiene que quedar claro quién la marca."
    - "No se implementa encima de un change archivado: verificar antes que el change sigue activo."
    - "Redactar cada tarea para quien no participó de la conversación: nombrar el archivo, el comando o el criterio concreto que la hace verificable. Un recordatorio que sólo entiende quien la pensó no le sirve a quien tiene que ejecutarla."
